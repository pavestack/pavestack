name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 2 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned by version tag pending dependabot's first github-actions
      # bump for this newly-added action - see the "action pinning" note
      # in AGENTS.md.
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Pinned by version tag pending dependabot's first github-actions
      # bump for this newly-added action - see the "action pinning" note
      # in AGENTS.md.
      - name: Upload Scorecard results as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
